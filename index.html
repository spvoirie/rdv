<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8' />
    <title>L'Atelier Capillaire | Dashboard Pro</title>
    
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --text-main: #1e293b;
            --event-bg: #eef2ff;
            --event-text: #4338ca;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            margin: 0; padding: 20px; color: var(--text-main);
        }

        .container { 
            max-width: 1300px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h2 { font-size: 1.8rem; font-weight: 700; margin: 0; letter-spacing: -0.025em; }

        /* --- STYLE DU CALENDRIER --- */
        .fc { border: none !important; }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid #f1f5f9 !important; }
        
        /* En-tête des jours */
        .fc-col-header-cell { background: #f8fafc; padding: 12px 0 !important; }
        .fc-col-header-cell-cushion { color: #64748b !important; font-weight: 600 !important; text-decoration: none !important; }

        /* Boutons stylés */
        .fc-button {
            background: #fff !important;
            color: #1e293b !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 10px !important;
            padding: 8px 16px !important;
            font-weight: 600 !important;
            transition: all 0.2s ease !important;
        }
        .fc-button-active { background: var(--primary) !important; color: #fff !important; border-color: var(--primary) !important; }
        .fc-button:hover { border-color: var(--primary) !important; transform: translateY(-1px); }

        /* --- ÉVÉNEMENTS (RDV) --- */
        .fc-event {
            border: none !important;
            border-left: 4px solid var(--primary) !important;
            background: var(--event-bg) !important;
            color: var(--event-text) !important;
            padding: 5px 10px !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            transition: all 0.2s ease-in-out !important;
        }
        .fc-event:hover {
            transform: scale(1.02);
            filter: brightness(0.95);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        /* --- MODAL DE DÉTAILS --- */
        #detailsModal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white; padding: 0; border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            z-index: 1001; width: 400px; overflow: hidden;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -45%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        .modal-header { background: var(--primary); color: white; padding: 20px; font-weight: 700; font-size: 1.1rem; }
        .modal-body { padding: 25px; }
        .detail-row { display: flex; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        .detail-label { width: 120px; color: #64748b; font-size: 0.9rem; font-weight: 500; }
        .detail-value { font-weight: 600; color: #1e293b; }
        
        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000;
        }

        .close-btn { 
            width: 100%; border: none; padding: 15px; background: #f1f5f9;
            color: #1e293b; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .close-btn:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>📅 Planning L'Atelier Capillaire</h2>
        </header>
        <div id='calendar'></div>
    </div>

    <div id="overlay"></div>
    <div id="detailsModal">
        <div class="modal-header">Fiche Rendez-vous</div>
        <div class="modal-body" id="modalContent"></div>
        <button class="close-btn" onclick="closeModal()">Fermer la fenêtre</button>
    </div>

    <script>
        const SB_URL = 'https://ysxawicsmdpirvalczmv.supabase.co';
        const SB_KEY = 'sb_publishable_GgDD8xm-IDHVVRvC-js2WA_WSZe0iCp';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'fr',
                timeZone: 'Europe/Paris',
                firstDay: 1, // Lundi
                allDaySlot: false,
                slotMinTime: '08:00:00',
                slotMaxTime: '20:00:00',
                height: 'auto',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: { today: "Aujourd'hui", month: "Mois", week: "Semaine", day: "Jour" },
                
                eventClick: function(info) {
                    const p = info.event.extendedProps;
                    const options = { hour: '2-digit', minute: '2-digit' };
                    
                    const content = `
                        <div class="detail-row"><div class="detail-label">Client</div><div class="detail-value">${p.name}</div></div>
                        <div class="detail-row"><div class="detail-label">Téléphone</div><div class="detail-value">${p.phone}</div></div>
                        <div class="detail-row"><div class="detail-label">Service</div><div class="detail-value">${p.service}</div></div>
                        <div class="detail-row"><div class="detail-label">Début</div><div class="detail-value">${info.event.start.toLocaleTimeString('fr-FR', options)}</div></div>
                        <div class="detail-row"><div class="detail-label">Fin</div><div class="detail-value">${info.event.end.toLocaleTimeString('fr-FR', options)}</div></div>
                    `;
                    document.getElementById('modalContent').innerHTML = content;
                    document.getElementById('detailsModal').style.display = 'block';
                    document.getElementById('overlay').style.display = 'block';
                },

                events: async function(info, successCallback, failureCallback) {
                    try {
                        const { data, error } = await supabaseClient
                            .from('appointments')
                            .select('start_time, end_time, clients(name, phone_number), services(name)')
                            .neq('status', 'cancelled');

                        if (error) throw error;

                        successCallback(data.map(appt => ({
                            title: `${appt.clients?.name} - ${appt.services?.name}`,
                            start: appt.start_time,
                            end: appt.end_time,
                            extendedProps: {
                                name: appt.clients?.name || 'Inconnu',
                                phone: appt.clients?.phone_number || 'Non renseigné',
                                service: appt.services?.name || 'Prestation'
                            }
                        })));
                    } catch (err) {
                        failureCallback(err);
                    }
                }
            });
            calendar.render();
        });

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
