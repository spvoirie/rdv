<script>
    const SB_URL = 'https://ysxawicsmdpirvalczmv.supabase.co';
    const SB_KEY = 'sb_publishable_GgDD8xm-IDHVVRvC-js2WA_WSZe0iCp';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        
        // Sécurité : on vérifie que l'élément existe avant de lancer FullCalendar
        if (!calendarEl) return;

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            locale: 'fr',
            // --- LA SOLUTION SIMPLE ---
            timeZone: 'UTC', // On force l'affichage "brut" pour ignorer les décalages navigateur
            // ---------------------------
            firstDay: 1, 
            allDaySlot: false,
            slotMinTime: '09:00:00',
            slotMaxTime: '19:00:00',
            height: 'auto',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            buttonText: {
                today: "Aujourd'hui",
                month: "Mois",
                week: "Semaine",
                day: "Jour",
                prev: "Précédent",
                next: "Suivant"
            },
            
            eventClick: function(info) {
                const p = info.event.extendedProps;
                // On force aussi l'affichage en UTC ici pour que la fiche soit raccord avec le planning
                const formatTime = (date) => date.toLocaleTimeString('fr-FR', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    timeZone: 'UTC' 
                });
                
                const content = `
                    <div class="detail-row"><div class="detail-label">Client</div><div class="detail-value">${p.name || 'Inconnu'}</div></div>
                    <div class="detail-row"><div class="detail-label">Numéro</div><div class="detail-value">${p.phone || '-'}</div></div>
                    <div class="detail-row"><div class="detail-label">Prestation</div><div class="detail-value">${p.service || 'Soin'}</div></div>
                    <div class="detail-row" style="border:none"><div class="detail-label">Horaire</div><div class="detail-value">${formatTime(info.event.start)} — ${formatTime(info.event.end)}</div></div>
                `;
                document.getElementById('modalContent').innerHTML = content;
                document.getElementById('detailsModal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            },

            events: async function(info, successCallback, failureCallback) {
                try {
                    const { data, error } = await supabaseClient
                        .from('appointments')
                        .select('start_time, end_time, clients(name, phone_number), services(name)')
                        .neq('status', 'cancelled');

                    if (error) throw error;

                    // On envoie les données telles quelles
                    const events = (data || []).map(appt => ({
                        title: `${appt.clients?.name || 'Client'} - ${appt.services?.name || 'Soin'}`,
                        start: appt.start_time,
                        end: appt.end_time,
                        extendedProps: {
                            name: appt.clients?.name || 'Inconnu',
                            phone: appt.clients?.phone_number || '-',
                            service: appt.services?.name || 'Soin'
                        }
                    }));
                    
                    successCallback(events);
                } catch (err) {
                    console.error("Erreur:", err);
                    failureCallback(err);
                }
            }
        });

        calendar.render();
    });

    // On s'assure que la fonction est accessible globalement pour le bouton fermer
    window.closeModal = function() {
        document.getElementById('detailsModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    };
</script>
