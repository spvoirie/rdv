<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8' />
    <title>L'Atelier Capillaire | Gestion</title>
    
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --card: #ffffff;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            margin: 0; padding: 20px;
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: var(--card); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
        }

        h2 { color: #1e293b; text-align: left; margin-bottom: 25px; font-weight: 600; }

        /* Style des Boutons */
        .fc-button {
            background: #fff !important;
            color: #475569 !important;
            border: 1px solid #e2e8f0 !important;
            font-weight: 500 !important;
            text-transform: capitalize !important;
            transition: all 0.2s !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
        }

        .fc-button-active {
            background: var(--primary) !important;
            color: #fff !important;
            border-color: var(--primary) !important;
        }

        .fc-button:hover { background: #f8fafc !important; }

        /* Style des événements */
        .fc-event {
            border-radius: 6px !important;
            padding: 4px 8px !important;
            border: none !important;
            background-color: #dbeafe !important;
            color: #1e40af !important;
            font-size: 0.85em !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .fc-event-title { font-weight: 600; }

        /* Modal / Pop-up */
        #detailsModal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 300px;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .modal-header { font-weight: 600; font-size: 1.2em; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .modal-body p { margin: 8px 0; color: #4b5563; }
        .close-btn { 
            margin-top: 15px;
            width: 100%;
            background: var(--primary);
            color: white; border: none; padding: 10px;
            border-radius: 6px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📅 Planning L'Atelier Capillaire</h2>
        <div id='calendar'></div>
    </div>

    <div id="overlay"></div>
    <div id="detailsModal">
        <div class="modal-header">Détails du Rendez-vous</div>
        <div class="modal-body" id="modalContent"></div>
        <button class="close-btn" onclick="closeModal()">Fermer</button>
    </div>

    <script>
        const SB_URL = 'https://ysxawicsmdpirvalczmv.supabase.co';
        const SB_KEY = 'sb_publishable_GgDD8xm-IDHVVRvC-js2WA_WSZe0iCp';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'fr',
                timeZone: 'Europe/Paris',
                firstDay: 1, 
                hiddenDays: [0, 6], // Cache Dimanche (0) et Samedi (6)
                slotMinTime: '08:30:00',
                slotMaxTime: '19:30:00',
                expandRows: true,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: { today: "Aujourd'hui", month: "Mois", week: "Semaine", day: "Jour" },
                
                // Au clic sur un événement
                eventClick: function(info) {
                    const props = info.event.extendedProps;
                    const content = `
                        <p><strong>Client :</strong> ${props.clientName}</p>
                        <p><strong>Service :</strong> ${props.serviceName}</p>
                        <p><strong>Téléphone :</strong> ${props.phone}</p>
                        <p><strong>Début :</strong> ${info.event.start.toLocaleTimeString('fr-FR')}</p>
                    `;
                    document.getElementById('modalContent').innerHTML = content;
                    document.getElementById('detailsModal').style.display = 'block';
                    document.getElementById('overlay').style.display = 'block';
                },

                events: async function(info, successCallback, failureCallback) {
                    try {
                        const { data, error } = await supabaseClient
                            .from('appointments')
                            .select(`
                                start_time, end_time,
                                clients ( name, phone_number ),
                                services ( name )
                            `)
                            .neq('status', 'cancelled');

                        if (error) throw error;

                        const events = data.map(appt => ({
                            title: `${appt.clients?.name} - ${appt.services?.name}`,
                            start: appt.start_time,
                            end: appt.end_time,
                            extendedProps: {
                                clientName: appt.clients?.name,
                                serviceName: appt.services?.name,
                                phone: appt.clients?.phone_number || 'Non renseigné'
                            }
                        }));
                        successCallback(events);
                    } catch (err) {
                        console.error(err);
                        failureCallback(err);
                    }
                }
            });

            calendar.render();
        });

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
