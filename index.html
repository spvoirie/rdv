<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8' />
    <title>Planning L'Atelier Capillaire</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        #calendar { margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📅 Planning L'Atelier Capillaire</h2>
        <div id='calendar'></div>
    </div>

    <script>
        // Utilisation de noms de variables uniques pour éviter les erreurs de syntaxe
        const SB_URL = 'https://ysxawicsmdpirvalczmv.supabase.co';
        const SB_KEY = 'sb_publishable_GgDD8xm-IDHVVRvC-js2WA_WSZe0iCp';
        
        // Initialisation du client avec un nom différent de la bibliothèque
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'fr',
                timeZone: 'Europe/Paris',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: async function(info, successCallback, failureCallback) {
                    try {
                        const { data, error } = await supabaseClient
                            .from('appointments')
                            .select(`
                                start_time, 
                                end_time, 
                                clients ( name ),
                                services ( name )
                            `)
                            .neq('status', 'cancelled');

                        if (error) throw error;

                        const events = data.map(appt => ({
                            title: `${appt.clients?.name || 'Client'} - ${appt.services?.name || 'Service'}`,
                            start: appt.start_time,
                            end: appt.end_time,
                            backgroundColor: '#3498db'
                        }));

                        successCallback(events);
                    } catch (err) {
                        console.error("Erreur de chargement:", err);
                        failureCallback(err);
                    }
                }
            });

            calendar.render();
        });
    </script>
</body>
</html>
