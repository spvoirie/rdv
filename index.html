<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/> 
    <title>L'Atelier Capillaire | Management</title>
    
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { 
            --brand-dark: #0f172a; 
            --brand-bg: #f8fafc; 
            --success: #10b981; 
            --danger: #ef4444; 
            --border: #e2e8f0;
            --accent: #3b82f6;
        }
        
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand-bg); color: var(--brand-dark); -webkit-tap-highlight-color: transparent; }
        .container { padding: 25px; max-width: 1600px; margin: auto; }

        /* HEADER & TOP BAR */
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        /* STYLE BOUTON RAPPEL AGRANDI */
        .rappel-pill { 
            padding: 12px 24px; border-radius: 100px; 
            font-weight: 800; font-size: 0.9rem; border: 2px solid transparent; 
            cursor: pointer; transition: all 0.3s ease; 
            display: flex; align-items: center; gap: 8px;
        }
        
        /* État Vert (Zéro) */
        .rappel-zero { background: #ecfdf5; color: var(--success); border-color: #a7f3d0; }
        
        /* État Rouge Clignotant */
        .rappel-active { 
            background: var(--danger); color: white; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .rappel-pill:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* CALENDAR */
        #calendar { background: white; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border); }
        .fc { --fc-border-color: #f1f5f9; --fc-button-bg-color: #ffffff; --fc-button-text-color: #0f172a; --fc-button-border-color: #e2e8f0; }
        .fc .fc-button { font-weight: 700 !important; border-radius: 10px !important; cursor: pointer !important; }
        .fc-event { cursor: pointer !important; transition: all 0.2s ease !important; }
        .fc-event:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.1) !important; }
        .event-ok { border-left: 5px solid var(--success) !important; background: white !important; }

        /* MODALS */
        #detailsModal, #listRappelsModal { 
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; border-radius: 28px; z-index: 2000; 
            width: 90%; max-width: 550px; 
            box-shadow: 0 40px 80px rgba(0,0,0,0.2); overflow: hidden; 
        }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-weight: 800; font-size: 1.1rem; color: var(--brand-dark); }
        .modal-body { padding: 25px; max-height: 70vh; overflow-y: auto; }

        /* LISTE RAPPELS */
        .rappel-item { 
            background: #f8fafc; padding: 15px; border-radius: 16px; margin-bottom: 12px;
            border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .rappel-info b { display: block; color: var(--brand-dark); font-size: 1rem; }
        .rappel-info span { font-size: 0.8rem; color: #64748b; }
        .rappel-actions { display: flex; gap: 8px; }

        /* INPUTS & BOUTONS (Identiques à ton style) */
        .unlock-badge { font-size: 0.65rem; font-weight: 800; padding: 6px 12px; border-radius: 8px; background: #f1f5f9; cursor: pointer; }
        .field { width: 100%; border: 1.5px solid #f1f5f9; padding: 12px; border-radius: 12px; font-weight: 700; background: #f8fafc; margin-top: 5px; }
        .field.unlocked { background: white; border-color: #cbd5e1; }
        .label { font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        
        #callLink, .btn-call-mini { 
            background: var(--brand-dark); color: white; padding: 10px; border-radius: 10px; 
            text-decoration: none; cursor: pointer; transition: 0.2s;
        }
        #callLink:hover, .btn-call-mini:hover { transform: scale(1.1); background: #1e293b; }

        .btn-main { border: none; padding: 15px; border-radius: 14px; font-weight: 800; cursor: pointer; flex: 1; transition: 0.2s; }
        .btn-close { background: #f1f5f9; color: #64748b; }
        .btn-save { background: var(--brand-dark); color: white; opacity: 0.2; pointer-events: none; }
        .btn-save.ready { opacity: 1; pointer-events: auto; }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.3); backdrop-filter: blur(4px); z-index: 1000; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <div>
            <h2 style="margin:0; font-weight: 800;">L'Atelier Capillaire</h2>
            <p style="margin:0; font-size: 0.8rem; font-weight: 600; color: #94a3b8;">Gestion des réservations</p>
        </div>
        <div id="rappelCount" class="rappel-pill rappel-zero" onclick="openListRappels()">0 Rappels en attente</div>
    </div>
    <div id='calendar'></div>
</div>

<div id="overlay" onclick="closeAllModals()"></div>

<div id="listRappelsModal">
    <div class="modal-header">
        <span class="modal-title">🚨 Rappels à traiter</span>
        <button class="unlock-badge" onclick="closeAllModals()">FERMER</button>
    </div>
    <div class="modal-body" id="rappelListContent">
        </div>
</div>

<div id="detailsModal">
    <div class="modal-header">
        <span class="modal-title">Détails du rendez-vous</span>
        <div id="unlockToggle" class="unlock-badge">🔒 DÉVERROUILLER</div>
    </div>
    <div class="modal-body">
        <div class="input-group"><span class="label">Client</span><input type="text" id="editClient" class="field" readonly></div>
        <div class="input-group"><span class="label">Motif</span><input type="text" id="editBene" class="field" readonly></div>
        <div class="input-group">
            <span class="label">Contact</span>
            <div style="display:flex; gap:8px;"><input type="text" id="editPhone" class="field" readonly><a id="callLink" href="#">📞</a></div>
        </div>
        <div style="display:flex; gap:12px;">
            <div style="flex:1;"><span class="label">Début</span><input type="datetime-local" id="editStart" class="field" readonly></div>
            <div style="flex:1;"><span class="label">Fin</span><input type="datetime-local" id="editEnd" class="field" readonly></div>
        </div>
        <div class="input-group" style="margin-top:15px;"><span class="label">Notes</span><textarea id="editNotes" class="field" readonly style="min-height:60px;"></textarea></div>
    </div>
    <div style="padding: 0 25px 25px; display: flex; gap: 10px;">
        <button class="btn-main btn-close" onclick="closeAllModals()">Fermer</button>
        <button class="btn-main btn-save" id="saveBtn">Enregistrer</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ysxawicsmdpirvalczmv.supabase.co';
    const SB_KEY = 'sb_publishable_GgDD8xm-IDHVVRvC-js2WA_WSZe0iCp';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let currentEvent = null;
    let allRappels = [];

    async function init() {
        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'timeGridWeek',
            locale: 'fr',
            headerToolbar: { left: 'today prev,next', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
            slotMinTime: '08:00:00', slotMaxTime: '20:00:00', allDaySlot: false, height: 'auto',
            eventClick: (info) => openModal(info.event),
            events: async (info, success) => {
                const { data } = await supabaseClient.from('appointments').select('*, clients(*)').neq('status', 'cancelled');
                
                // Filtrage : On sépare les rappels des RDV
                allRappels = data.filter(a => a.beneficiary_name?.toUpperCase().includes('RAPPEL') || a.start_time === a.end_time);
                const rdvs = data.filter(a => !allRappels.includes(a));

                updateRappelUI(allRappels.length);
                
                success(rdvs.map(a => ({
                    id: a.id, title: (a.beneficiary_name || a.clients?.name), start: a.start_time, end: a.end_time,
                    className: 'event-ok', extendedProps: a
                })));
            }
        });
        calendar.render(); window.cal = calendar;
    }

    function updateRappelUI(count) {
        const btn = document.getElementById('rappelCount');
        btn.innerText = `${count} Rappel${count > 1 ? 's' : ''} en attente`;
        if(count > 0) {
            btn.className = 'rappel-pill rappel-active';
        } else {
            btn.className = 'rappel-pill rappel-zero';
        }
    }

    function openListRappels() {
        const content = document.getElementById('rappelListContent');
        content.innerHTML = allRappels.length ? '' : '<p style="text-align:center; color:#94a3b8;">Aucun rappel en attente. Beau travail !</p>';
        
        allRappels.forEach(r => {
            const div = document.createElement('div');
            div.className = 'rappel-item';
            div.innerHTML = `
                <div class="rappel-info">
                    <b>${r.beneficiary_name.replace('RAPPEL : ', '')}</b>
                    <span>${r.notes || 'Pas de motif précisé'}</span>
                    <small style="color:var(--accent)">Le ${new Date(r.start_time).toLocaleString('fr-FR')}</small>
                </div>
                <div class="rappel-actions">
                    <a href="tel:${r.clients?.phone_number}" class="btn-call-mini">📞 Appeler</a>
                    <button onclick="archiveRappel('${r.id}')" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">✅</button>
                </div>
            `;
            content.appendChild(div);
        });
        document.getElementById('listRappelsModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    async function archiveRappel(id) {
        await supabaseClient.from('appointments').update({ status: 'cancelled' }).eq('id', id);
        window.cal.refetchEvents();
        setTimeout(openListRappels, 300); // Rafraîchit la liste
    }

    // --- LOGIQUE FICHE CLIENT (RDV) ---
    function openModal(event) {
        currentEvent = event; const p = event.extendedProps;
        document.getElementById('editClient').value = p.clients?.name || '';
        document.getElementById('editBene').value = p.beneficiary_name || '';
        document.getElementById('editPhone').value = p.clients?.phone_number || '';
        document.getElementById('editStart').value = p.start_time.substring(0,16);
        document.getElementById('editEnd').value = p.end_time.substring(0,16);
        document.getElementById('editNotes').value = p.notes || '';
        document.getElementById('callLink').href = `tel:${p.clients?.phone_number}`;
        document.getElementById('detailsModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
        resetLock();
    }

    document.getElementById('unlockToggle').onclick = function() {
        const isL = this.innerText.includes('🔒');
        document.querySelectorAll('.field').forEach(f => { f.readOnly = !isL; f.classList.toggle('unlocked', isL); });
        this.innerText = isL ? "🔓 MODIFICATION" : "🔒 DÉVERROUILLER";
        this.classList.toggle('active', isL);
        document.getElementById('saveBtn').classList.toggle('ready', isL);
    };

    document.getElementById('saveBtn').onclick = async function() {
        await supabaseClient.from('appointments').update({ 
            beneficiary_name: document.getElementById('editBene').value, 
            notes: document.getElementById('editNotes').value,
            start_time: document.getElementById('editStart').value, end_time: document.getElementById('editEnd').value 
        }).eq('id', currentEvent.id);
        window.cal.refetchEvents(); closeAllModals();
    };

    function resetLock() { 
        document.querySelectorAll('.field').forEach(f => { f.readOnly = true; f.classList.remove('unlocked'); });
        document.getElementById('unlockToggle').innerText = "🔒 DÉVERROUILLER";
        document.getElementById('saveBtn').classList.remove('ready');
    }

    function closeAllModals() { 
        document.getElementById('detailsModal').style.display = 'none'; 
        document.getElementById('listRappelsModal').style.display = 'none'; 
        document.getElementById('overlay').style.display = 'none'; 
    }

    window.onload = init;
</script>
</body>
</html>
