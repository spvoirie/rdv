<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8' />
    <title>Planning L'Atelier Capillaire</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        #calendar { background: #ffffff; }
        /* Style des événements */
        .fc-event { cursor: pointer; border: none !important; padding: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📅 Planning L'Atelier Capillaire</h2>
        <div id='calendar'></div>
    </div>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = 'https://ysxawicsmdpirvalczmv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_GgDD8xm-IDHVVRvC-js2WA_WSZe0iCp';
        
        // Initialisation du client avec un nom unique pour éviter les conflits
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'fr',
                timeZone: 'Europe/Paris',
                firstDay: 1, // Commence le lundi
                slotMinTime: '08:00:00', // Ouverture salon
                slotMaxTime: '20:00:00', // Fermeture salon
                allDaySlot: false,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: {
                    today: "Aujourd'hui",
                    month: "Mois",
                    week: "Semaine",
                    day: "Jour"
                },
                events: async function(info, successCallback, failureCallback) {
                    try {
                        const { data, error } = await _supabase
                            .from('appointments')
                            .select(`
                                start_time, 
                                end_time, 
                                status,
                                clients ( name ),
                                services ( name )
                            `)
                            .neq('status', 'cancelled');

                        if (error) throw error;

                        const events = data.map(appt => ({
                            title: `${appt.clients?.name || 'Client'} - ${appt.services?.name || 'Prestation'}`,
                            start: appt.start_time,
                            end: appt.end_time,
                            backgroundColor: '#3498db',
                            borderColor: '#2980b9'
                        }));

                        successCallback(events);
                    } catch (err) {
                        console.error("Erreur chargement RDV:", err);
                        failureCallback(err);
                    }
                }
            });

            calendar.render();
        });
    </script>
</body>
</html>
