<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8' />
    <title>L'Atelier Capillaire | Dashboard Premium</title>
    
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --brand-dark: #0f172a;    /* Ardoise sombre */
            --brand-accent: #6366f1;  /* Indigo Pro */
            --brand-bg: #f8fafc;      /* Gris très clair */
            --event-fill: #ffffff;    /* Blanc pur pour le contenu rdv */
        }

        html, body { 
            margin: 0; padding: 0; min-height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--brand-bg);
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        .container { padding: 20px; box-sizing: border-box; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 25px; padding: 0 10px;
        }

        h2 { font-size: 1.6rem; font-weight: 800; color: var(--brand-dark); letter-spacing: -0.5px; }

        /* --- CALENDRIER --- */
        #calendar {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Style des créneaux de RDV */
        .fc-v-event {
            background-color: white !important;
            border: none !important;
            border-left: 4px solid var(--brand-accent) !important;
            border-radius: 10px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06) !important;
            margin: 1px 0 !important;
        }

        .fc-event-main {
            padding: 6px !important;
        }

        .fc-event-title {
            color: var(--brand-dark) !important;
            font-weight: 700 !important;
            font-size: 0.9rem !important;
        }

        /* Boutons de navigation Modernes */
        .fc-button {
            background: white !important;
            color: var(--brand-dark) !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 12px !important;
            padding: 10px 20px !important;
            font-weight: 600 !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
        }

        .fc-button-active {
            background: var(--brand-dark) !important;
            color: white !important;
            border-color: var(--brand-dark) !important;
        }

        .fc-button:hover {
            border-color: var(--brand-accent) !important;
            background: #fdfdfd !important;
        }

        /* En-tête des colonnes */
        .fc-col-header-cell-cushion {
            color: #64748b !important;
            font-weight: 600 !important;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        /* --- MODAL --- */
        #detailsModal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white; border-radius: 24px;
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.25);
            z-index: 2000; width: 90%; max-width: 420px;
            overflow: hidden;
        }

        .modal-header { 
            background: var(--brand-dark); color: white; 
            padding: 24px; font-weight: 700; font-size: 1.2rem;
            display: flex; justify-content: space-between; align-items: center;
        }

        .modal-body { padding: 30px; }
        
        .detail-row { 
            display: flex; flex-direction: column; 
            margin-bottom: 18px; border-bottom: 1px solid #f1f5f9; 
            padding-bottom: 10px; 
        }
        
        .detail-label { color: #94a3b8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .detail-value { font-weight: 700; color: var(--brand-dark); font-size: 1.1rem; }
        
        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); z-index: 1000;
        }

        .close-btn { 
            width: 100%; border: none; padding: 20px; background: #f8fafc;
            font-weight: 800; font-size: 1rem; color: var(--brand-accent);
            cursor: pointer; border-top: 1px solid #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>L'Atelier Capillaire</h2>
        </header>
        <div id='calendar'></div>
    </div>

    <div id="overlay" onclick="closeModal()"></div>
    <div id="detailsModal">
        <div class="modal-header">Détails du RDV</div>
        <div class="modal-body" id="modalContent"></div>
        <button class="close-btn" onclick="closeModal()">FERMER</button>
    </div>

    <script>
        const SB_URL = 'https://ysxawicsmdpirvalczmv.supabase.co';
        const SB_KEY = 'sb_publishable_GgDD8xm-IDHVVRvC-js2WA_WSZe0iCp';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'fr',
                timeZone: 'Europe/Paris',
                firstDay: 1, 
                allDaySlot: false,
                slotMinTime: '08:30:00',
                slotMaxTime: '19:30:00',
                height: 'auto',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: {
                    today: "Aujourd'hui",
                    month: "Mois",
                    week: "Semaine",
                    day: "Jour",
                    prev: "Précédent",
                    next: "Suivant"
                },
                
                eventClick: function(info) {
                    const p = info.event.extendedProps;
                    const formatTime = (date) => date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    
                    const content = `
                        <div class="detail-row"><div class="detail-label">Client</div><div class="detail-value">${p.name}</div></div>
                        <div class="detail-row"><div class="detail-label">Numéro</div><div class="detail-value">${p.phone}</div></div>
                        <div class="detail-row"><div class="detail-label">Prestation</div><div class="detail-value">${p.service}</div></div>
                        <div class="detail-row" style="border:none"><div class="detail-label">Horaire</div><div class="detail-value">${formatTime(info.event.start)} — ${formatTime(info.event.end)}</div></div>
                    `;
                    document.getElementById('modalContent').innerHTML = content;
                    document.getElementById('detailsModal').style.display = 'block';
                    document.getElementById('overlay').style.display = 'block';
                },

                events: async function(info, successCallback, failureCallback) {
                    try {
                        const { data, error } = await supabaseClient
                            .from('appointments')
                            .select('start_time, end_time, clients(name, phone_number), services(name)')
                            .neq('status', 'cancelled');

                        if (error) throw error;

                        successCallback(data.map(appt => ({
                            title: `${appt.clients?.name} | ${appt.services?.name}`,
                            start: appt.start_time,
                            end: appt.end_time,
                            extendedProps: {
                                name: appt.clients?.name || 'Inconnu',
                                phone: appt.clients?.phone_number || '-',
                                service: appt.services?.name || 'Soin'
                            }
                        })));
                    } catch (err) {
                        failureCallback(err);
                    }
                }
            });
            calendar.render();
        });

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
