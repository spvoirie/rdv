<script>
    const SB_URL = 'https://ysxawicsmdpirvalczmv.supabase.co';
    const SB_KEY = 'sb_publishable_GgDD8xm-IDHVVRvC-js2WA_WSZe0iCp';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            locale: 'fr',
            timeZone: 'UTC', // Affiche l'heure brute de la base sans calcul
            firstDay: 1, 
            allDaySlot: false,
            slotMinTime: '09:00:00',
            slotMaxTime: '19:00:00',
            height: 'auto',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            buttonText: {
                today: "Aujourd'hui",
                month: "Mois",
                week: "Semaine",
                day: "Jour",
                prev: "Précédent",
                next: "Suivant"
            },
            
            eventClick: function(info) {
                const p = info.event.extendedProps;
                // Formatage de l'heure pour la petite fiche (Modal)
                const formatOptions = { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' };
                const startStr = info.event.start.toLocaleTimeString('fr-FR', formatOptions);
                const endStr = info.event.end.toLocaleTimeString('fr-FR', formatOptions);
                
                const content = `
                    <div class="detail-row"><div class="detail-label">Client</div><div class="detail-value">${p.name}</div></div>
                    <div class="detail-row"><div class="detail-label">Numéro</div><div class="detail-value">${p.phone}</div></div>
                    <div class="detail-row"><div class="detail-label">Prestation</div><div class="detail-value">${p.service}</div></div>
                    <div class="detail-row" style="border:none"><div class="detail-label">Horaire</div><div class="detail-value">${startStr} — ${endStr}</div></div>
                `;
                document.getElementById('modalContent').innerHTML = content;
                document.getElementById('detailsModal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            },

            events: async function(info, successCallback, failureCallback) {
                try {
                    const { data, error } = await supabaseClient
                        .from('appointments')
                        .select('start_time, end_time, clients(name, phone_number), services(name)')
                        .neq('status', 'cancelled');

                    if (error) throw error;

                    const formattedEvents = data.map(appt => ({
                        title: (appt.clients?.name || 'Inconnu') + " - " + (appt.services?.name || 'Soin'),
                        start: appt.start_time,
                        end: appt.end_time,
                        extendedProps: {
                            name: appt.clients?.name || 'Inconnu',
                            phone: appt.clients?.phone_number || '-',
                            service: appt.services?.name || 'Soin'
                        }
                    }));
                    
                    successCallback(formattedEvents);
                } catch (err) {
                    console.error("Erreur Supabase:", err);
                    failureCallback(err);
                }
            }
        });
        
        calendar.render();
    });

    function closeModal() {
        document.getElementById('detailsModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }
</script>
